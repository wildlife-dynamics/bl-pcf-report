[workspace]
platforms = ['linux-64', 'osx-arm64', 'osx-64', 'win-64']

name = "bl-pcf-report"
channels = [
  'https://repo.prefix.dev/ecoscope-workflows/',
  'https://repo.prefix.dev/ecoscope-workflows-custom/',
  'conda-forge',
]

[dependencies]
wt-compiler = "==0.10.2"
graphviz = "*"
go-yq = "*"
python = "3.14.*"  # 3.15 resolves ruamel.yaml 0.17, which breaks the VERSION.yaml dump

[tasks.compile]
cmd = './dev/recompile.sh --install'

[tasks.recompile]
cmd = './dev/recompile.sh --update'
