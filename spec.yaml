id: bl_pcf_report
requirements:
  - name: ecoscope-platform
    version: "2.18.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "1.0.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.0.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

rjsf-overrides:
  properties:
    # Previous Period — clarify that the comparison period ends where the current time range begins
    Previous Period.properties.set_previous_period.properties.offset.description: "Choose how to calculate the comparison period's Start Date. In every mode, the comparison period ends on your selected time range's Start Date (so it never overlaps with the current period) — only the Start Date changes."

workflow:
  # Set workflow details 
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details
  
  # Define time range 
  - name: Time Range
    id: time_range
    task: set_time_range

  # Define groupers 
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers: 
        - index_name: "Ranch"
        
  #  Connect to ER 
  - name: Connect to ER 
    id: er_client_name 
    task: set_er_connection

  # Set basemaps connection 
  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 20

  - name: Download amboseli conservancy layers
    id: ambo_ranch_layers
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/wrcp3pnnxqyrclzmbtt1r/amboseli_ranch_conservancies_layers.gpkg?rlkey=jfbqj1b1nwhijxbsy7b2v1d29&st=d7rbqdfe&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3 
      unzip: false 
  
  - name: Download amboseli ranch boundaries and electric fence
    id: ambo_bound_fence 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/k6dgrmxmxeb3fe6glihwa/amboseli_group_ranch_boundaries_x_electric_fence.gpkg?rlkey=limtzffe88lr0iof5kf3b6uoy&st=rreho3tq&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download ambo conservancies 
    id: ambo_conservancies 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/blo1smf49buhwx24y4z60/amboseli_group_ranch_boundaries.gpkg?rlkey=w86emavj8ug7zab73ifbzg6jv&st=v8uptlb0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Load amboseli conservancy layers 
    id: load_ambo_layers 
    task: load_df 
    partial:  
      file_path: ${{ workflow.ambo_ranch_layers.return }}
      layer: null 
      deserialize_json: false 

  - name: Load amboseli ranch boundaries and electric fence 
    id: load_ambo_boundaries_fence 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_bound_fence.return }}
      layer: null 
      deserialize_json: false 
  
  - name: Load amboseli conservancies 
    id: load_ambo_conservancies 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_conservancies.return }}
      layer: null 
      deserialize_json: false 

  - name: Reproject gdf to 4326 for ambo layers 
    id: reproject_ambo_layers 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_layers.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo boundaries and electric fence 
    id: reproject_ambo_boundaries 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_boundaries_fence.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo conservancies
    id: reproject_ambo_conservancies
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_conservancies.return }}
      target_crs: "EPSG:4326"

  - name: Apply colormap to amboseli land_use column
    id: apply_ambo_color
    task: apply_color_map
    partial:
      df: ${{ workflow.reproject_ambo_layers.return }}
      input_column_name: land_use
      output_column_name: land_use_color
      colormap:
        Rangeland: "#a39c91"
        Rangeland and settlement: "#ffa07a"
        Settlement and agriculture: "#2f4f4f"
        Conservancies: "#8fbc8b"
        National parks and reserves: "#4d6600"

  - name: Create amboseli land_use layer
    id: create_land_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.apply_ambo_color.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: land_use_color
        get_line_color: land_use_color
        get_line_width: 0.85
        opacity: 0.75
      legend:
        title: Map Layers
        values:
          - label: Conservancies
            color: "#8fbc8b"

          - label: National park and reserves
            color: "#4d6600"

          - label: Settlement and agriculture
            color: "#2f4f4f"

          - label: Rangeland
            color: "#a39c91"

          - label: Rangeland and settlement
            color: "#ffa07a"

  - name: Filter to ambo ranch boundaries only
    id: filter_ambo_boundaries
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Ranch boundaries
      reset_index: true

  - name: Filter to ambo electric fence only
    id: filter_ambo_fence
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Electric Fence
      reset_index: true

  - name: Create ambo ranch boundaries layer
    id: create_bound_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_ambo_boundaries.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [0, 0, 0]
        get_line_width: 0.95
        opacity: 0.55
      legend:
        title: ""
        values:
          - label: Ranch boundaries
            color: "#000000"

  - name: Create ambo electric fence layer
    id: create_fence_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_ambo_fence.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [45, 98, 177]
        get_line_width: 5.5
        opacity: 1.0
      legend:
        title: ""
        values:
          - label: Electric fence
            color: "#2d62b1"
 
  - name: Retrieve Livestock Predation Events
    id: get_current_events
    task: get_events

    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns: [
        "id", "time", "event_type", 
        "event_category", "reported_by", 
        "serial_number", "geometry", 
        "event_details","patrols"
        ]
      event_types:
        - hwc_lvstprd
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: true
      force_point_geometry: true 
  
  - title: Previous Period
    type: task-group
    description: >-
      Define the comparison ("previous") period to contrast against your selected time range.
      Every option below computes a period that ends on the same End Date as your time range, then
      works backward to determine its Start Date. Choose Custom to enter your own Years / Months /
      Weeks / Days offset (defaults to 1 month back), Preset for a common lookback (e.g. 1, 3 or 6
      months, or 1 year back), or Calendar to pick an exact Start Date.
    tasks: 
      - name: null
        id: set_previous_period
        task: ecoscope_workflows_ext_ste.tasks.filter.flexible_previous_period
        partial: 
          timerange: ${{ workflow.time_range.return }}

  - name: Retrieve previous period events
    id: get_previous_events
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.set_previous_period.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details

      event_types:
        - hwc_lvstprd
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: true
      force_point_geometry: true 

  - name: Extract current date from events data
    id: extract_cevent_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_current_events.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Extract previous date from events data
    id: extract_pevent_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_previous_events.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Process current events details
    id: process_current_details
    task: ecoscope_workflows_ext_custom.tasks.io.process_events_details
    partial:
      df: ${{ workflow.extract_cevent_date.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true

  - name: Process previous events details
    id: process_previous_details
    task: ecoscope_workflows_ext_custom.tasks.io.process_events_details
    partial:
      df: ${{ workflow.extract_pevent_date.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize Current Events Column Names
    id: normalize_current_events 
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_current_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Normalize Previous Events Column Names
    id: normalize_previous_events 
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_previous_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  - name: Drop column prefix from current events 
    id: drop_currente_prefix 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.normalize_current_events.return }}
      prefix: event_details__
      duplicate_strategy: keep_original 

  - name: Drop column prefix from previous events 
    id: drop_previouse_prefix 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.normalize_previous_events.return }}
      prefix: event_details__
      duplicate_strategy: keep_original 

  - name: Drop hwc from current events 
    id: drop_current_hwc 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.drop_currente_prefix.return }}
      prefix: hwc_lvstprd__
      duplicate_strategy: keep_original 

  - name: Drop hwc from previous events 
    id: drop_previous_hwc 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_column_prefix
    partial: 
      df: ${{ workflow.drop_previouse_prefix.return }}
      prefix: hwc_lvstprd__
      duplicate_strategy: keep_original 

  - name: Rename and Filter Current Event Columns
    id: map_current_columns 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_current_hwc.return }}
      drop_columns: [
        "event_category",
        "event_type",
        "reported_by",
        "event_type_display",
        "Boma coordinate X",
        "Boma coordinate Y",
        "GPS Accuracy",
        "Owner ID number",
        "Owner name",
        "patrols",
        "Additional information",
        # "Adults injured",
        # "Adults killed",
        "Age of herders",
        "Area",
        "Community reaction",
        "Did anyone see the predator",
        "Did the predator enter boma",
        "Did the predator scare livestock from inside boma",
        "Does boma have LED simba lights",
        "Does boma have predator proof fencing",
        "GPS Accuracy",
        "Name of verification officer",
        "Number of herders",
        "Owner ID number",
        "Owner name",
        "Partners present",
        "Predator Scout present",
        "Sex of herders",
        "Teams involved",
        "Time of verification",
        "Tracks present",
        "Zone",
        "verification officer",
        "verification time",
        ]
      retain_columns: []
      rename_columns: {}
      raise_if_not_found: false

  - name: Rename and Filter Previous Event Columns
    id: map_previous_columns 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_previous_hwc.return }}
      drop_columns: [
        "event_category",
        "event_type",
        "reported_by",
        "event_type_display",
        "Boma coordinate X",
        "Boma coordinate Y",
        "GPS Accuracy",
        "Owner ID number",
        "Owner name",
        "patrols",
        "Additional information",
        # "Adults injured",
        # "Adults killed",
        "Age of herders",
        "Area",
        "Community reaction",
        "Did anyone see the predator",
        "Did the predator enter boma",
        "Did the predator scare livestock from inside boma",
        "Does boma have LED simba lights",
        "Does boma have predator proof fencing",
        "GPS Accuracy",
        "Name of verification officer",
        "Number of herders",
        "Owner ID number",
        "Owner name",
        "Partners present",
        "Predator Scout present",
        "Sex of herders",
        "Teams involved",
        "Time of verification",
        "Tracks present",
        "Zone",
        "verification officer",
        "verification time",
        ]
      retain_columns: []
      rename_columns: {}
      raise_if_not_found: false

  - name: Filter Current Events to Target Ranches
    id: retain_current_ranches
    task: filter_row_values 
    partial: 
      df: ${{ workflow.map_current_columns.return }}
      column: Ranch 
      values: [
        "Eselengei",
        "Mbirikani", 
        "Kimana"
        ]
  
  - name: Filter Previous Events to Target Ranches
    id: retain_previous_ranches
    task: filter_row_values 
    partial: 
      df: ${{ workflow.map_previous_columns.return }}
      column: Ranch 
      values: [
        "Eselengei",
        "Mbirikani", 
        "Kimana"
        ]

  - name: Filter Current Events to Valid Claims Only
    id: filter_current_valid_claims
    task: filter_row_values
    partial: 
      df: ${{ workflow.retain_current_ranches.return }}
      column: "Validity of claim"
      values: ["Valid"]

  - name: Filter Previous Events to Valid Claims Only
    id: filter_previous_valid_claims
    task: filter_row_values
    partial: 
      df: ${{ workflow.retain_previous_ranches.return }}
      column: "Validity of claim"
      values: ["Valid"]

  - name: Combine columns to bypass errors 
    id: current_adult_kills
    task: create_combined_column 
    partial: 
      df: ${{ workflow.filter_current_valid_claims.return }}
      primary_column: "Adults killed"
      fallback_column: "hwc_lvstpd_number_adults killed"
      output_column: "total_adult_livestock_killed"
      fill_remaining: 0 
   
  - name: Combine columns to bypass errors 
    id: previous_adult_kills
    task: create_combined_column 
    partial: 
      df: ${{ workflow.filter_previous_valid_claims.return }}
      primary_column: "Adults killed"
      fallback_column: "hwc_lvstpd_number_adults killed"
      output_column: "total_adult_livestock_killed"
      fill_remaining: 0 

  - name: Combine columns to bypass errors 
    id: current_young_kills
    task: create_combined_column 
    partial: 
      df: ${{ workflow.current_adult_kills.return }}
      primary_column: "Young (<1yr) killed"
      fallback_column: "hwc_lvstprd_<1yr"
      output_column: "total_young_livestock_killed"
      fill_remaining: 0 
   
  - name: Combine columns to bypass errors 
    id: previous_young_kills
    task: create_combined_column 
    partial: 
      df: ${{ workflow.previous_adult_kills.return }}
      primary_column: "Young (<1yr) killed"
      fallback_column: "hwc_lvstprd_<1yr"
      output_column: "total_young_livestock_killed"
      fill_remaining: 0 

  - name: Convert current event columns to numeric 
    id: current_events_numeric 
    task: convert_column_values_to_numeric 
    partial: 
      df: ${{ workflow.current_young_kills.return }}
      columns: [
        "Compensation value to owner",
        "total_adult_livestock_killed",
        "total_young_livestock_killed"
      ]

  - name: Convert previous event columns to numeric 
    id: previous_events_numeric 
    task: convert_column_values_to_numeric 
    partial: 
      df: ${{ workflow.previous_young_kills.return }}
      columns: [
        "Compensation value to owner",
        "total_adult_livestock_killed",
        "total_young_livestock_killed"
      ]   
  
  - name: Replace Missing Values in Current Events with N/A
    id: replace_current_missing
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fill_missing_values
    partial: 
      df: ${{ workflow.current_events_numeric.return }}
      subset: [
        "Compensation value to owner",
        "total_adult_livestock_killed",
        "total_young_livestock_killed"
        ]
      value: 0
      
  - name: Replace Missing Values in Previous Events with N/A
    id: replace_previous_missing
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fill_missing_values
    partial: 
      df: ${{ workflow.previous_events_numeric.return }}
      subset: [
        "Compensation value to owner",
        "total_adult_livestock_killed",
        "total_young_livestock_killed"
        ]
      value: 0

  - name: Replace Missing Values in Previous Events with Unknown 
    id: replace_current_unknown
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fill_missing_values
    partial: 
      df: ${{ workflow.replace_current_missing.return }}
      subset: [
        "Animal responsible",
        "Boma type",
        "Livestock species",
        "Type of claim",
        "Where were the livestock when the attack happened"
        ]
      value: "Unknown"

  - name: Replace Missing Values in Previous Events with Unknown 
    id: replace_previous_unknown
    task: ecoscope_workflows_ext_mnc.tasks.transformation.fill_missing_values
    partial: 
      df: ${{ workflow.replace_previous_missing.return }}
      subset: [
        "Animal responsible",
        "Boma type",
        "Livestock species",
        "Type of claim",
        "Where were the livestock when the attack happened"
        ]
      value: "Unknown"

  - name: Compute total livestock killed in current events
    id: compute_current_killed_total
    task: ecoscope.platform.tasks.analysis.apply_arithmetic_operation_over_rows
    partial:
      df: ${{ workflow.replace_current_unknown.return }}
      column_a: "total_adult_livestock_killed"
      column_b: "total_young_livestock_killed"
      output_column: "total_animals_killed"
      operation: "add"

  - name: Compute total livestock killed in previous events
    id: compute_previous_killed_total
    task: ecoscope.platform.tasks.analysis.apply_arithmetic_operation_over_rows
    partial:
      df: ${{ workflow.replace_previous_unknown.return }}
      column_a: "total_adult_livestock_killed"
      column_b: "total_young_livestock_killed"
      output_column: "total_animals_killed"
      operation: "add"

  - name: Persist current events as csv
    id: current_events_df
    task: persist_df 
    partial: 
      df: ${{ workflow.compute_current_killed_total.return }}
      filename: "current_events"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: "csv"

  - name: Persist previous events as csv
    id: previous_events_df
    task: persist_df 
    partial: 
      df: ${{ workflow.compute_previous_killed_total.return }}
      filename: "previous_events"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: "csv"

  - name: Overall Predation Incidents Summary
    id: overall_predation_incidents
    task: crosstab_summary
    partial: 
      data: ${{ workflow.compute_current_killed_total.return }}
      index_col: "Animal responsible"
      column_col: "Livestock species"
      aggfunc: "sum"
      reset_index: false 
      margins: true
      value_col: null 
      margins_name: "Total"
      fill_value: 0 
      normalize: false
      dropna: false

  - name: Overall Livestock Killed Summary
    id: overall_predation_killed 
    task: crosstab_summary
    partial:
      data: ${{ workflow.compute_current_killed_total.return }}
      index_col: "Animal responsible"
      column_col: "Livestock species"
      value_col: "total_animals_killed"
      aggfunc: "sum"
      reset_index: false
      margins: true
      margins_name: "Total"
      normalize: false 
      fill_value: 0 
      dropna: false
    
  - name: Overall Compensation Value Summary
    id: overall_compensation_summary 
    task: crosstab_summary
    partial: 
      data: ${{ workflow.compute_current_killed_total.return }}
      index_col: "Animal responsible"
      column_col: "Livestock species"
      value_col: "Compensation value to owner"
      aggfunc: "sum"
      reset_index: false
      margins: true
      margins_name: "Total"
      normalize: false 
      fill_value: 0 
      dropna: false

  - name: Compile Overall Predation Summary Table
    id: overall_summary_table 
    task: summarize_predation_table 
    partial: 
      incidents: ${{ workflow.overall_predation_incidents.return }}
      kills: ${{ workflow.overall_predation_killed.return }}
      compensation: ${{ workflow.overall_compensation_summary.return }}

  - name: Save Overall Predation Summary Table
    id: persist_overall_table 
    task: persist_df 
    partial: 
      df: ${{ workflow.overall_summary_table.return }}
      filename: "overall_predation_summary"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: "geoparquet"

  # Ranch groupers
  - name: Split Predation Events by Ranch
    id: split_by_ranch 
    task: split_groups
    partial: 
      df: ${{ workflow.compute_current_killed_total.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Split Previous Predation Events by Ranch
    id: split_previous_by_ranch
    task: split_groups
    partial:
      df: ${{ workflow.compute_previous_killed_total.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Predation Incidents Summary by Ranch
    id: predation_ranch_incidents
    task: crosstab_summary
    partial:
      index_col: "Animal responsible"
      column_col: "Livestock species"
      aggfunc: "sum"
      reset_index: false
      margins: true 
      value_col: null
      margins_name: "Total"
      normalize: false 
